[project]
name = "data"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
]
requires-python = ">=3.12"
dependencies = [
    "ipykernel>=7.4.0",
    "nflreadpy>=0.1.5",
    "pandas>=3.0.6",
    "pip>=26.2.1",
    "psycopg[binary]>=3.3.6",
    "pyarrow>=25.0.1",
    "scikit-learn>=1.9.1",
    "sqlalchemy>=2.0.54",
]

[project.scripts]
backend = "data.main:main"
ping = "data.ping_supabase:main"
[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "jupytext>=1.19.6",
]
