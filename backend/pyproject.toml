[project]
name = "nfl-project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "KenJiang10", email = "TheKenJiang10@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "nflreadpy>=0.1.5",
    "pandas>=3.0.6",
    "psycopg[binary]>=3.3.6",
    "pyarrow>=25.0.1",
    "sqlalchemy>=2.0.54",
]

[project.scripts]
nfl-project = "nfl_project:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"
